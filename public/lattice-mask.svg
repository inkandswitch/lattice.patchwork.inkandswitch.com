<?xml version="1.0" encoding="UTF-8"?>
<!-- lattice.svg in one colour, for safari's pinned tabs -->
<svg viewBox="0 0 417 417" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<!-- a needle, upright: a knob at the top, the shaft, a pointed tip -->
		<g id="needle">
			<path d="M -24 70 L 24 70 L 24 318 L 3 384 Q 0 392 -3 384 L -24 318 Z"/>
			<circle cx="0" cy="46" r="42"/>
		</g>
		<clipPath id="ball">
			<circle cx="202.66" cy="125.68" r="83"/>
		</clipPath>
	</defs>

	<!-- the needles, leaning as patchwork's bars do (cyan, and the accent) -->
	<use href="#needle" fill="black" transform="translate(42 22) rotate(-3.9)"/>
	<use href="#needle" fill="black" transform="translate(346 2) rotate(-3.9)"/>

	<!-- the ball of yarn (blue): wound strands across it, and its end -->
	<circle cx="202.66" cy="125.68" r="83" fill="black"/>
	<g clip-path="url(#ball)" fill="none" stroke="white" stroke-width="9" stroke-linecap="round">
		<path d="M 128 80 C 175 110 220 170 248 214"/>
		<path d="M 148 54 C 200 92 248 152 276 196"/>
		<path d="M 178 40 C 226 72 268 120 288 160"/>
		<path d="M 122 120 C 150 98 196 70 256 58"/>
		<path d="M 124 160 C 166 126 224 96 284 92"/>
		<path d="M 146 196 C 190 160 240 136 286 134"/>
	</g>
	<path d="M 270 172 C 296 196 300 222 284 240" fill="none" stroke="black" stroke-width="12" stroke-linecap="round"/>

	<!-- the triangle (orange), as it was -->
	<path fill="black" d="M 125.518753 373.348145 L 158.21283 234.407776 C 159.088745 230.686005 162.816727 228.377228 166.538498 229.253128 L 305.478851 261.947205 C 311.482422 263.36084 312.782288 271.325684 307.536499 274.572937 L 135.902054 380.819214 C 130.656281 384.066467 124.105103 379.351685 125.518753 373.345367 Z"/>
</svg>
