<?xml version="1.0" encoding="UTF-8"?>
<!-- lattice's icon: patchwork's, knitted. its two bars are knitting needles,
     its circle a ball of yarn, its triangle as it was. the colours are the
     lattice themes' (public/packages/lattice-themes): each halfway from the
     light theme's to the dark's, so it's bright on either -->
<svg viewBox="0 0 417 417" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<!-- a needle, upright: a knob at the top, the shaft, a pointed tip -->
		<g id="needle">
			<path d="M -24 70 L 24 70 L 24 318 L 3 384 Q 0 392 -3 384 L -24 318 Z"/>
			<circle cx="0" cy="46" r="42"/>
			<!-- where the light catches it -->
			<path d="M -9 92 L -9 310" stroke="#fcfaff" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round" fill="none"/>
		</g>
		<clipPath id="ball">
			<circle cx="202.66" cy="125.68" r="83"/>
		</clipPath>
	</defs>

	<!-- the needles, leaning as patchwork's bars do (the purple, and the
	     accent) -->
	<use href="#needle" fill="#a17cdb" transform="translate(42 22) rotate(-3.9)"/>
	<use href="#needle" fill="#d3669f" transform="translate(346 2) rotate(-3.9)"/>

	<!-- the ball of yarn (the pink): wound strands across it, and its end -->
	<circle cx="202.66" cy="125.68" r="83" fill="#f197c2"/>
	<g clip-path="url(#ball)" fill="none" stroke="#b5357c" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round">
		<path d="M 128 80 C 175 110 220 170 248 214"/>
		<path d="M 148 54 C 200 92 248 152 276 196"/>
		<path d="M 178 40 C 226 72 268 120 288 160"/>
		<path d="M 122 120 C 150 98 196 70 256 58"/>
		<path d="M 124 160 C 166 126 224 96 284 92"/>
		<path d="M 146 196 C 190 160 240 136 286 134"/>
	</g>
	<path d="M 270 172 C 296 196 300 222 284 240" fill="none" stroke="#f197c2" stroke-width="12" stroke-linecap="round"/>

	<!-- the triangle (the orange), as it was -->
	<path fill="#d37636" d="M 125.518753 373.348145 L 158.21283 234.407776 C 159.088745 230.686005 162.816727 228.377228 166.538498 229.253128 L 305.478851 261.947205 C 311.482422 263.36084 312.782288 271.325684 307.536499 274.572937 L 135.902054 380.819214 C 130.656281 384.066467 124.105103 379.351685 125.518753 373.345367 Z"/>
</svg>
